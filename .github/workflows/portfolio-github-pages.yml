# Публикует сайт-визитку (Astro) в корень GitHub Pages и demo-страницы в подпути.
# Включите: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy Portfolio site (GitHub Pages)

# Без фильтра paths: любой push в main пересобирает витрину. Иначе после коммита
# только в README/кейсах workflow не запускался бы, а при ошибочном источнике Pages
# «из ветки» на главной оказывался README (см. docs/PORTFOLIO_SITE.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            04-web/finance-data-screener/frontend/package-lock.json
      - name: Install and build site
        working-directory: site
        env:
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
        run: |
          npm ci
          npm run build
      - name: Build finance-data-screener demo
        working-directory: 04-web/finance-data-screener/frontend
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE: "/Portfolio/finance-data-screener/"
        run: |
          npm ci
          npx vite build
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/superstore
          mkdir -p _site/rf-macro-risk-ai
          mkdir -p _site/fintech-ab-test
          mkdir -p _site/finance-data-screener
          mkdir -p _site/fedresurs-mvp
          mkdir -p _site/leadgen-n8n-system
          cp -r site/dist/. _site/
          cp "01-data-analytics/superstore-retail-analytics/superstore-dashboard.html" _site/superstore/index.html
          cp "01-data-analytics/superstore-retail-analytics/title-bg.png" _site/superstore/title-bg.png
          cp -r "03-ai-products/rf-macro-risk-ai/docs/." _site/rf-macro-risk-ai/
          cp "01-data-analytics/fintech-ab-test-credit-offer/reports/presentation.html" _site/fintech-ab-test/index.html
          cp -r "04-web/finance-data-screener/frontend/dist/." _site/finance-data-screener/
          cp "01-data-analytics/fedresurs-mvp/demo/index.html" _site/fedresurs-mvp/index.html
          cp "02-automation/leadgen-n8n-system/demo/index.html" _site/leadgen-n8n-system/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
