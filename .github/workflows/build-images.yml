# Сборка и push образов в GHCR при изменениях в соответствующих путях.
name: Build Docker images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/Dockerfile.backend"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # 02 — Automation
          - { image: bankrot-trades-scraper,        context: 02-automation/bankrot-trades-scraper }
          # 03 — AI Products
          - { image: finance-mcp-server,            context: 03-ai-products/finance-mcp-server/product-mcp }
          - { image: hr-breaker,                    context: 03-ai-products/hr-breaker }
          - { image: rf-macro-risk-ai,              context: 03-ai-products/rf-macro-risk-ai }
          - { image: svo-payments-bot,              context: 03-ai-products/svo-payments-bot }
          - { image: team-ai-bot,                   context: 03-ai-products/team-ai-bot }
          - { image: personal-rag-assistant,        context: 03-ai-products/personal-rag-assistant }
          - { image: tg-digest-pipeline,            context: 03-ai-products/tg-digest-pipeline }
          # 04 — Web
          - { image: svo-payouts-website,           context: 04-web/svo-payouts-website/web }
          - { image: finance-data-screener-backend, context: 04-web/finance-data-screener/backend }
          - { image: finance-data-screener-frontend,context: 04-web/finance-data-screener/frontend }
          - { image: mini-crm-backend,              context: 04-web/mini-crm-fastapi-react/backend }
          - { image: finsight-backend,              context: 04-web/finsight/backend }
          - { image: finsight-frontend,             context: 04-web/finsight/frontend }
          - { image: dostaffkin-backend,            context: 04-web/dostaffkin, file: 04-web/dostaffkin/Dockerfile.backend }
    concurrency:
      group: ghcr-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Job summary
        run: |
          echo "## Docker image: \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "| Параметр | Значение |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ matrix.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Context | \`${{ matrix.context }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dockerfile | \`${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
