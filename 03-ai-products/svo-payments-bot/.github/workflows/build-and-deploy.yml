# Сборка образа → GitHub Container Registry (ghcr.io) → деплой по SSH на сервер.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST              — хост сервера (IP или домен)
#   SSH_USER              — пользователь SSH
#   SSH_PRIVATE_KEY       — приватный ключ (весь PEM, включая BEGIN/END)
#   DEPLOY_PATH           — каталог на сервере: обязателен .env; docker-compose.deploy.yml подтянется с raw.githubusercontent.com, если файла нет (репо должно быть публичным)
#   GHCR_USERNAME         — логин GitHub для docker login на сервере (часто совпадает с владельцем образа)
#   GHCR_READ_TOKEN       — PAT с правом read:packages (для приватного образа обязателен; для публичного тоже удобен)
#
# На сервере в DEPLOY_PATH должен лежать docker-compose (или свой манифест), где image совпадает с ghcr.io/... ниже.

name: Build, push to GHCR, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag_sha: ${{ steps.vars.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR — только нижний регистр)
        id: vars
        run: |
          OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/${OWNER_LOWER}/${REPO_LOWER}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ] && [ -n "${{ secrets.SSH_USER }}" ] && \
             [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && [ -n "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SSH secrets not configured — skipping deploy. Image pushed to GHCR."
            echo "Задайте секреты в Settings → Secrets → Actions: SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH"
          fi

      - name: Run remote deploy
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE: ghcr.io/kaluginvit72/svo_viplaty
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script: |
            set -euo pipefail
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            test -d "$DEPLOY_PATH" || { echo "Нет каталога: [$DEPLOY_PATH]"; ls -la /opt || true; exit 1; }
            cd "$DEPLOY_PATH"
            if [ ! -f docker-compose.deploy.yml ]; then
              echo "docker-compose.deploy.yml нет в каталоге — скачиваю из GitHub (нужен публичный репозиторий)..."
              curl -fsSL -o docker-compose.deploy.yml \
                "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.deploy.yml" \
                || { echo "Не удалось скачать compose (приватный репо или нет curl) — положите docker-compose.deploy.yml вручную"; exit 1; }
            fi
            test -f .env || { echo "Нет .env — создайте на сервере из .env.example"; exit 1; }
            export APP_IMAGE="${IMAGE}:latest"
            if [ -n "${GHCR_TOKEN:-}" ] && [ -n "${GHCR_USER:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans
            docker image prune -f
