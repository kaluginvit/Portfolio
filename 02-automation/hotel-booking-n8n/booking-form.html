<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование отеля</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 28px;
      color: #1a1a1a;
    }
    .field {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a1a;
      background: #fafafa;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #4f6ef7;
      background: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #3a57d6; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: #e6f4ea;
      color: #1e7e34;
      display: block;
    }
    .message.error {
      background: #fdecea;
      color: #c0392b;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Бронирование отеля</h1>
    <form id="bookingForm">
      <div class="field">
        <label>Ваше имя</label>
        <input type="text" name="client_name" placeholder="Иван Петров" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="ivan@example.com" required>
      </div>
      <div class="field">
        <label>Отель</label>
        <select name="hotel_name" required>
          <option value="">— выберите отель —</option>
          <option value="Hotel_Aurora">Hotel Aurora</option>
          <option value="Hotel_Neva">Hotel Neva</option>
          <option value="Hotel_Ural">Hotel Ural</option>
          <option value="Hotel_Ocean">Hotel Ocean</option>
          <option value="Hotel_Baikal">Hotel Baikal</option>
          <option value="Hotel_Sochi">Hotel Sochi</option>
        </select>
      </div>
      <div class="field">
        <label>Тип номера</label>
        <select name="room_type" required>
          <option value="">— выберите тип —</option>
          <option value="standard">Standard</option>
          <option value="deluxe">Deluxe</option>
          <option value="suite">Suite</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label>Дата заезда</label>
          <input type="date" name="date_from" required>
        </div>
        <div class="field">
          <label>Дата выезда</label>
          <input type="date" name="date_to" required>
        </div>
      </div>
      <button type="submit" id="submitBtn">Забронировать</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <script>
    const WEBHOOK_URL = 'https://n8n.kalugin-consulting.ru/webhook/hotel-booking';

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      const form = e.target;

      const data = {
        client_name: form.client_name.value.trim(),
        email: form.email.value.trim(),
        hotel_name: form.hotel_name.value,
        room_type: form.room_type.value,
        date_from: form.date_from.value,
        date_to: form.date_to.value,
      };

      btn.disabled = true;
      btn.textContent = 'Отправляем...';
      msg.className = 'message';

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = 'Запрос отправлен! Проверьте почту — мы пришлём подтверждение.';
          form.reset();
        } else {
          throw new Error(`Ошибка сервера: ${res.status}`);
        }
      } catch (err) {
        msg.className = 'message error';
        msg.textContent = err.message || 'Не удалось отправить запрос. Попробуйте позже.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Забронировать';
      }
    });
  </script>
</body>
</html>
